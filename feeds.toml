# Sources this board adds to the framework's base feeds.
#
# There is no soc kind here. UniXNU-muyu pins UniXNU-sm7675-common for its SoC and reaches its
# two SoC patches through a soc: series line; the SM6225 equivalent does not exist -
# github.com/UniXNU/UniXNU-sm6225-common returns 404, checked 2026-11-26 and again 2026-11-27.
# A source with an empty commit and a series line pointing into a checkout that never arrives is
# a build that fails late, in patch application, with a message about a missing file rather than
# about a missing repository.
#
# So the board carries the two changes itself, as ordinary device patches:
# xun-pmgr-bringup and xun-clustered-mpidr. Both were read from the reference SoC layer and
# neither is SM7675-specific. If an SM6225 layer is published, add it back here as
# name = "sm6225", kind = "soc", and move the series line back - see board.toml patch_series.

[[source]]
name = "IOStorageFamily"
kind = "refer"
git = "https://github.com/apple-oss-distributions/IOStorageFamily.git"
ref = "main"
commit = "e45fbe30a7879e0b16e26dddb78538f1b00e0bff"
