# Sources this board adds to the framework's base feeds.
#
# The SoC layer is a pinned shared repository, not a vendored copy: [board]
# soc_source = "sm6225" selects it by name, and every patch this board's series names
# under soc: comes from that checkout. Re-pin the commit and unixnu.lock together.
#
# NOTE: the SM6225 layer is the one piece of this repository that does not exist yet.
# UniXNU-muyu pins UniXNU-sm7675-common for its SoC; xun needs the equivalent for
# SM6225 (bengal/khaje), and until it is published the two soc: patches
# (sheng-platform-power, native-smp-secondary) have nowhere to come from.
# scripts/check-xun-board.py reports this as the first missing input rather than
# letting a build fail later with an unresolved patch path.

[[source]]
name = "sm6225"
kind = "soc"
git = "https://github.com/UniXNU/UniXNU-sm6225-common"
ref = "main"
# Empty on purpose: pinning a commit that does not exist would be a claim the file
# cannot back. Fill this in together with the ref once the repository is public.
commit = ""

[[source]]
name = "IOStorageFamily"
kind = "refer"
git = "https://github.com/apple-oss-distributions/IOStorageFamily.git"
ref = "main"
commit = "e45fbe30a7879e0b16e26dddb78538f1b00e0bff"
